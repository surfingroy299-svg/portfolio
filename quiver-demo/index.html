  <body>
    <div id="root"></div>
    <script>
      // Portfolio entry shim — added for designeroy.com, not part of the product build.
      // The journey stage is held in React state and deliberately kept out of the URL
      // (the comparison rewrites location.hash on scroll), so sample mode cannot be
      // deep-linked. This presses the build's own "Skip to recommendation" control once,
      // then drops the query so a reload or Restart returns to the normal intro.
      (function () {
        if (!/(^|[?&])start=sample($|&)/.test(location.search)) return;
        var started = Date.now();
        (function press() {
          var btn = Array.prototype.find.call(
            document.querySelectorAll('.protoctl__btn'),
            function (b) { return /skip/i.test(b.textContent || ''); }
          );
          if (btn) {
            btn.click();
            history.replaceState(null, '', location.pathname + location.hash);
            return;
          }
          if (Date.now() - started < 8000) requestAnimationFrame(press);
        })();
      })();
    </script>
  </body>
</html>
